[workspace]
members = [
  "crates/builtin-panels/view-controls",
  "crates/builtin-panels/job-progress",
  "crates/builtin-panels/koma-list",
  "crates/builtin-panels/snapshots",
  "crates/builtin-panels/workspace-presets",
  "crates/builtin-panels/app-actions",
  "crates/builtin-panels/text-flow",
  "crates/builtin-panels/tool-palette",
  "crates/builtin-panels/tool-settings",
  "crates/builtin-panels/layers",
  "crates/builtin-panels/color-palette",
  "crates/builtin-panels/workspace-layout",
  "crates/paint-engine",
  "crates/geometry",
  "crates/raster",
  "crates/editor-state",
  "crates/document-model",
  "crates/desktop-support",
  "crates/panel-runtime",
  "crates/panel-protocol",
  "crates/panel-macros",
  "crates/panel-sdk",
  "crates/panel-wasm-host",
  "crates/gpu-paint",
  "crates/panel-html",
  "crates/canvas-geometry",
  "crates/storage",
  "crates/pen-io",
  "crates/panel-workspace",
  "apps/desktop",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"
authors = ["Naoto"]

[workspace.dependencies]
anyhow = "1.0"
font8x8 = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tinyfiledialogs = "3.9"
thiserror = "2.0"
winit = "0.30"
wgpu = "28.0"
pollster = "0.4"
